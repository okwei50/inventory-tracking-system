apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: inventory-api
          image: 899259776056.dkr.ecr.ca-central-1.amazonaws.com/inventory-lambda:k8s
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PASSWORD
              value: "postgres123"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api-service
spec:
  selector:
    app: inventory-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort
